<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body onload="setInterval(() => digitalClock(),1000)">

    <div class="clock">
        <div class="date">
            <h2>Date</h2>
            <h2>Day</h2>
        </div>
        <div class="time">
            <h2>Time</h2>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
